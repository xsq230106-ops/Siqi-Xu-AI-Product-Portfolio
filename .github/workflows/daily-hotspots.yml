name: Daily Hotspot Update

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - run: npm ci

      - name: Validate DeepSeek API key
        run: |
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret not configured. Hotspot pipeline will be skipped."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
          fi

      - name: Run hotspot pipeline
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: python scripts/build_hotspots.py --limit 4
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Build static site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
